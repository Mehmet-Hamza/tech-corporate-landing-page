<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Teknoloji Login</title>
    
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" referrerpolicy="no-referrer" />
    
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --BGCOLOR: #212529;
            --LFTBGCOLOR: #1a1a1a;
            --ACCENTCOLOR: #FAF8F1;
            --TEXTDARK: #343a40;
            --LINKBLUE: #1E90FF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--BGCOLOR);
            font-family: "Montserrat", sans-serif;
            padding: 1rem;
        }

        .login-container {
            background-color: var(--ACCENTCOLOR);
            width: 100%;
            max-width: 60rem;
            min-height: 32rem;
            display: flex;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
        }

        /* Left Side Styles */
        .leftside {
            background-color: var(--LFTBGCOLOR);
            width: 50%;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 1.5rem;
            text-align: center;
        }

        .topside {
            background-image: url('img/X-Teknoloji şeffaf arka plan.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            width: 100%;
            height: 8rem;
        }

        .leftside h1 {
            font-size: 1.8rem;
            margin-top: 0.5rem;
        }

        p.desc-text {
            font-size: 0.85rem;
            line-height: 1.5;
            text-align: justify;
            letter-spacing: 0.5px;
            opacity: 0.9;
            margin: 1rem 0;
        }

        .social-media {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.2rem;
        }

        .social-media a {
            color: #ffffff;
            font-size: 1.6rem;
            transition: color 0.3s ease, opacity 0.3s ease;
        }

        .social-media a:hover {
            opacity: 0.7;
            color: var(--LINKBLUE);
        }

        /* Right Side Styles */
        .rightside {
            background-color: var(--ACCENTCOLOR);
            width: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1.5rem;
            justify-content: center;
        }

        .signup-or-signin {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3rem;
            width: 100%;
            max-width: 20rem;
            margin-bottom: 1.5rem;
        }

        .signup-or-signin a {
            text-decoration: none;
            color: var(--TEXTDARK);
            font-size: 1.2rem;
            font-weight: 700;
            padding-bottom: 0.5rem;
            transition: opacity 0.3s ease;
        }

        .signup-or-signin a:hover {
            opacity: 0.6;
        }

        .signup-or-signin a.active {
            border-bottom: 3px solid var(--LINKBLUE);
            color: var(--LINKBLUE);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            width: 100%;
            max-width: 20rem;
        }

        .input-field {
            width: 100%;
            border: 1px solid #ccc;
            background-color: #ffffff;
            padding: 0.8rem 1.2rem;
            border-radius: 50px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-field:focus {
            border-color: var(--LINKBLUE);
        }

        .forgot-psw {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .checkbox input[type="checkbox"] {
            cursor: pointer;
        }

        .checkbox label {
            color: var(--LFTBGCOLOR);
            font-size: 0.8rem;
            cursor: pointer;
        }

        .forgot a {
            color: var(--LINKBLUE);
            text-decoration: none;
            font-size: 0.8rem;
        }

        .forgot a:hover {
            text-decoration: underline;
        }

        .veya p {
            color: var(--TEXTDARK);
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            margin: 0.2rem 0;
        }

        .btn-submit {
            width: 100%;
            height: 2.8rem;
            background-color: var(--BGCOLOR);
            border: none;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background-color: #343a40;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .google-button {
            width: 100%;
        }

        .google-button button {
            width: 100%;
            height: 2.8rem;
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--TEXTDARK);
            box-shadow: rgba(0, 0, 0, 0.1) 0px 2px 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background-color 0.3s ease;
        }

        .google-button button:hover {
            background-color: #f1f1f1;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                max-width: 25rem;
                min-height: auto;
            }

            .leftside, .rightside {
                width: 100%;
            }

            .leftside {
                padding: 1.5rem 1rem;
            }

            p.desc-text {
                display: none; 
            }

            .topside {
                height: 5rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">

        <!-- Sol Panel -->
        <div class="leftside">
            <div class="topside"></div>
            <h1>Hoş Geldiniz</h1>
            <p class="desc-text">
                Geleceği inşa etmek, bugünün teknolojisini anlamaktan geçer.
                X Teknoloji, kullanıcı odaklı web ve yazılım projeleriyle iş dünyasına değer katmayı hedefler.
                Yenilik, güven ve kalite — bizim için sadece kelimeler değil, her projemizin temelidir.
            </p>
            <div class="social-media">
                <a href="#" aria-label="Instagram"><i class="fa-brands fa-square-instagram"></i></a>
                <a href="#" aria-label="Facebook"><i class="fa-brands fa-square-facebook"></i></a>
                <a href="#" aria-label="Twitter"><i class="fa-brands fa-square-x-twitter"></i></a>
                <a href="#" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
            </div>
        </div>

        <!-- Sağ Panel -->
        <div class="rightside">
            <div class="signup-or-signin">
                <a class="sign-in active" href="index.html">Giriş Yap</a>
                <a class="sign-up" href="#">Üye Ol</a>
            </div>   

            <form action="index.html">
                <input type="text" class="input-field" placeholder="Kullanıcı Adı" required>
                <input type="password" class="input-field" placeholder="Şifre" required>

                <div class="forgot-psw">
                    <div class="checkbox">
                        <input type="checkbox" id="remember-me">
                        <label for="remember-me">Beni Hatırla</label>
                    </div>
                    <div class="forgot">    
                        <a href="#">Şifremi Unuttum?</a>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Giriş Yap</button>

                <div class="veya">
                    <p>Veya</p>
                </div>

                <div class="google-button">
                    <button type="button">
                        <i class="fa-brands fa-google"></i>
                        Google İle Devam Et
                    </button>
                </div>
            </form>
        </div>

    </div>

</body>
</html>
